[package]
name = "formica-app"
description = "Phase 2/3: interactive Bevy viewer with a GPU pheromone texture and an egui parameter panel."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "formica-app"
path = "src/main.rs"

[dependencies]
formica-core.workspace = true
# Only what a 2D simulation viewer needs: no 3D, no audio, no glTF.
bevy = { workspace = true, default-features = false, features = ["2d", "ui"] }
bevy_egui.workspace = true
# Window-icon support only: Bevy exposes no icon API, so we set it ourselves
# on the winit window. Same 0.30 line as bevy_winit uses, so the two resolve
# to one package.
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
# Native file dialogs for scenario import/export (IFileDialog on Windows).
# Opened on a worker thread, so the frame loop keeps running while the
# dialog is up.
rfd = "0.15"
