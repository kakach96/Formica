[package]
name = "formica-app"
description = "Phase 2/3: interactive Bevy viewer with a GPU pheromone texture and an egui parameter panel."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "formica-app"
path = "src/main.rs"

[dependencies]
formica-core.workspace = true
# Only what a 2D simulation viewer needs: no 3D, no audio, no glTF.
bevy = { workspace = true, default-features = false, features = ["2d", "ui"] }
bevy_egui.workspace = true
